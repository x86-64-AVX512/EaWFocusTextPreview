name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  notepad-plugin-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and test Notepad++ plugin
        shell: cmd
        run: notepadpp_plugin\build_plugin.bat
